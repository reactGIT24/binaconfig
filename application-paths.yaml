api:
  paths:
    version: /api/v1

    #------------------ Authentication ------------------
    auth:
      base: ${api.paths.version}/auth
      signup: /signup
      signin: /signin
      signout: /signout
      verify-email: /verify-email
      forgot-password: /forgot-password
      reset-password: /reset-password
      resend-verification: /resend-verification

    admin-auth:
      base: ${api.paths.version}/admin/auth
      signup: /signup
      delete-unverified-accounts: /delete-unverified-accounts

    custom-auth:
      base: ${api.paths.version}/custom/auth
      find-user: /find-userId

    #------------------ Blacklist ------------------
    blacklist:
      base: ${api.paths.version}/blacklist
      add-jwt: /add-jwt
      find-jwt: /find-jwt
      delete-all-jwt: /delete-all-jwt

    #----------------- Administration -----------------
    specifications: /specification

    #----------------- Operation -----------------
    admin-operation:
      base: ${api.paths.version}/admin/operation
      categories: /categories
      add-categories: /add-categories
      add-subcategories: /add-subcategories
      add-products: /add-products
      update-categories: /update-categories
      update-subcategories: /update-subcategories
      update-products: /update-products

    operation:
      base: ${api.paths.version}/operation
      categories: /categories
      add-categories: /find-categories
      add-subcategories: /find-subcategories
      add-products: /find-products

    #------------------ Notification ------------------
    notification:
      base: ${api.paths.version}/notification
      confirm-registration: /confirm-registration
      reset-password: /reset-password
      passwordchanged: /passwordchanged
      temporary-password: /temporary-password
