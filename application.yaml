#---------------- disable security completely ----------------------------
security:
   basic:
      enabled: false

#----------------- Tracing across all microservices  Zipkin ----------------------
#zipkin:
   #base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
   #sender:
      #type: web
   #compression:
      #enabled: true

management:
   tracing:
      enabled: true
      sampling:
         probability: 1.0                              # Captures 100% of local development traces
   zipkin:
      tracing:
         endpoint: "${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans" #  NEW CORRECT SYNTAX

management:
   tracing:
      sampling:
         probability: 1.0
      propagation:
         type: b3  # B3 propagation for Zipkin
   endpoints:
      web:
         exposure:
           include: gateway,health,info,metrics

logging:
   level:
      org.springframework.cloud.gateway: DEBUG
      org.springframework.web: DEBUG
      org.springframework.web.reactive: DEBUG
      zipkin2: DEBUG
   pattern:
      level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

#--------------- Eureka Client -----------------------------------  
eureka:
   client:
       fetch-registry: true
       register-with-eureka: true
       serviceUrl:
           defaultZone: ${eureka_url:http://localhost:8761/eureka}           
   instance: 
       hostname: localhost

#----------------- Gateway custom security configuration properties -------------------------
gateway:
   security:
      token-subject: api-gateway 
      port-check: true  
      # Whitelisted IPs allowed to access the API Gateway (comma-separated)
      # Includes localhost, IPv6 loopback, and Docker bridge network CIDR (172.16.0.0/12)
      whitelist-ips: 
         - 127.0.0.1
         #- 192.168.1.10
      whitelist-ports:
         - 8080
         
         # Shared secret key used for signing JWT tokens.
         # Must be at least 256 bits (32 bytes) long.
         # Value: "this-secret-is-large-enough-to-be-safe-and-256-bit-secure!" base64 encoded
      shared-secret: "dGhpcy1zZWNyZXQtaXMtbGFyZ2UtZW5vdWdoLXRvLWJlLXNhZmUtYW5kLTI1Ni1iaXQtc2VjdXJlIQ=="
        
      # Token expiration in milliseconds (e.g. 5000ms = 5s to prevent replay attacks)
      token-expiration-ms: 5000
      allowed-paths:
         - /actuator/health
         - /actuator/info


