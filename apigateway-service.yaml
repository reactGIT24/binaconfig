#--------------------------------------------------------
# Server
#--------------------------------------------------------
server:
  port: 8080 
  servlet: 
    session: 
      persistent: false
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types:
      - application/json

#--------------------------------------------------------
# Spring
#--------------------------------------------------------
spring:
  main:
    web-application-type: reactive

  threads:
    virtual:
      enabled: true

  codec:
    max-in-memory-size: -1 # Remove buffer limits

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 600000    
        response-timeout: 600s # 180s for long polls                
      globalcors:
        add-to-simple-url-handler-mapping: true 
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:5173" #local
            #allowed-origins: "https://xxxxxxxx" #production
            allowed-headers: 
              - Authorization
              - Content-Type
              - Accept
            allowed-methods:
              - GET
              - POST
              - DELETE
              - PUT
              - OPTIONS                                  
              - PATCH

# --------------------------------------------------------------
# Enable Monitoring
# --------------------------------------------------------------
management:
  endpoints:
    web:
      exposure: 
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  health: 
    circuitbreakers:
      enabled: true
