#---------------- Server --------------------  
server:
   port: 8084
   servlet: 
      session: 
         persistent: false
      encoding:
         charset: UTF-8
         force: true
      http2:
         enabled: true	
# for production   logging.level.root=INFO

#----------------- Database --------------------
spring: 
  datasource: 
    url: jdbc:mysql://localhost:3306/bina24_redis?useSSL=false&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ungermysql
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      pool-name: HikariCP
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    database: MYSQL
    generate-ddl: true
    show-sql: false
    open-in-view: true 
    hibernate: 
      ddl-auto: update
      #ddl-auto: validate production
      naming: 
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl 
    properties: 
      hibernate: 
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        enable_lazy_load_no_trans: false
  sql:
    init: 
      platform: mysql
#--------------------------------------------------------
app:
   redisconfig:
      status: UP
      session-timeout: 1800 # 30 min
      key-splitor: _
      jwtblacklist-prefix: jwtblacklist
      category-prefix: category
      category-key: cpbzcategory
      jwtblaklist-key: cpjwtblacklist
      env-Id: 100 # development
      # env-Id: 200 uat
      # env-Id: 300 #  production
