#--------------------------------------------------------
# Server
#--------------------------------------------------------  
server:
   port: 8082
   servlet: 
      session: 
         persistent: false
      encoding:
         charset: UTF-8
         force: true
      http2:
         enabled: true	
# for production   logging.level.root=INFO

spring:
   datasource:
      url: jdbc:mysql://localhost:3306/bina24_customer?useSSL=false&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: root
      password: ungermysql
      hikari:
          maximum-pool-size: 30
          minimum-idle: 10
          pool-name: HikariCP
   sql:
      init:
         platform: mysql
   jpa:
      database: MYSQL
      generate-ddl: true
      show-sql: false
      open-in-view: false 
      hibernate: 
         ddl-auto: update                    
         naming: 
            physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl 
      properties: 
         hibernate: 
            dialect: org.hibernate.dialect.MySQLDialect
            format_sql: true
            use_sql_comments: true
            enable_lazy_load_no_trans: false

            
